      - generic [ref=f2e249]:
        - generic [ref=f2e250]:
          - heading "Vocês atendem quem não tem plano?" [level=3] [ref=f2e251]
          - paragraph [ref=f2e252]: Sim. Atendemos qualquer família, com ou sem plano, e apresentamos as opções e formas de pagamento no primeiro contato.
